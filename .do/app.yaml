name: ssdi-campaigns
region: nyc
features:
  - buildpack-stack=ubuntu-22
services:
  - name: web
    github:
      repo: ABBYCRM/ssdi-campaigns
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /
      initial_delay_seconds: 40
      period_seconds: 10
    envs:
      - key: NODE_ENV
        value: "production"
        scope: RUN_AND_BUILD_TIME
      - key: HOST
        value: "0.0.0.0"
        scope: RUN_AND_BUILD_TIME
      - key: PORT
        value: "8080"
        scope: RUN_AND_BUILD_TIME
      - key: NITRO_PRESET
        value: node-server
        scope: RUN_AND_BUILD_TIME
      - key: VITE_AUTH_ENABLED
        value: "false"
        scope: RUN_AND_BUILD_TIME
      # SSDI Campaigns only. Never reuse CaseClosedFL HubSpot tokens, Resend
      # keys, sending domains, or Vapi assistant IDs. Bind these secrets in
      # the App Platform dashboard — do not commit values:
      #   HUBSPOT_ACCESS_TOKEN          (primary CRM; SSDI private app)
      #   GOOGLE_SHEETS_SPREADSHEET_ID  (backup / failover only)
      #   GOOGLE_SHEETS_RANGE           (default Leads!A1)
      #   GOOGLE_SHEETS_CLIENT_EMAIL
      #   GOOGLE_SHEETS_PRIVATE_KEY
      #   GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON
      #   RESEND_API_KEY                (ssdicampaigns.com Resend project — verify domain)
      #   VITE_PUBLIC_PHONE             (SSDI Vapi number; rebuild after setting)
      #   INBOUND_PHONE_NUMBER          (same number; never CaseClosedFL +15615661360)
      #   VAPI_WEBHOOK_SECRET
      #   VAPI_ASSISTANT_ID             (SSDI assistant — not CaseClosedFL)
      - key: RESEND_API_KEY
        type: SECRET
        scope: RUN_TIME
        value: ""
      - key: RESEND_FROM_EMAIL
        value: "SSDI Campaigns <noreply@ssdicampaigns.com>"
        scope: RUN_TIME
      - key: RESEND_REPLY_TO
        value: "Intake@abbycrm.com"
        scope: RUN_TIME
      # After the SSDI Vapi assistant number exists, set both to that E.164
      # number and redeploy (Vite inlines VITE_* at build). Never +15615661360.
      - key: VITE_PUBLIC_PHONE
        value: ""
        scope: RUN_AND_BUILD_TIME
      - key: INBOUND_PHONE_NUMBER
        value: ""
        scope: RUN_AND_BUILD_TIME
