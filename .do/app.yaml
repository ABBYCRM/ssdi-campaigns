name: ssdi-campaigns
region: nyc
features:
  - buildpack-stack=ubuntu-22
services:
  - name: web
    github:
      repo: ABBYCRM/ssdi-campaigns
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /
      initial_delay_seconds: 40
      period_seconds: 10
    envs:
      - key: NODE_ENV
        value: "production"
        scope: RUN_AND_BUILD_TIME
      - key: HOST
        value: "0.0.0.0"
        scope: RUN_AND_BUILD_TIME
      - key: PORT
        value: "8080"
        scope: RUN_AND_BUILD_TIME
      - key: NITRO_PRESET
        value: node-server
        scope: RUN_AND_BUILD_TIME
      - key: VITE_AUTH_ENABLED
        value: "false"
        scope: RUN_AND_BUILD_TIME
